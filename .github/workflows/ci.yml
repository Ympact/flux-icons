name: CI

on:
  # main and dev were missing from the pull request list, so a pull request into either got no
  # checks at all while a push to them did. Pull requests now cover every branch CI is meant to
  # gate, and push keeps only dev, the integration branch: a post-merge run of what the pull
  # request already ran is a second full matrix for the same tree.
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main","dev","v1","v2"]

  workflow_dispatch:

# A push to a pull request makes the run for its previous commit moot. Keyed by pull request
# number rather than by branch name, because two forks can use the same one and neither of
# those runs supersedes the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        # Laravel 11 is past its security support window: every 11.x release carries
        # unpatched advisories, which Composer refuses to install, so the leg cannot
        # resolve at all. The composer.json constraint still allows ^11 to stay in
        # step with livewire/flux, it is simply no longer testable.
        laravel: ['12', '13']
        flux: ['1', '2']
        exclude:
          - laravel: '13'
            flux: '1'
        
        include:
          - laravel: '13'
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, json, zip
          coverage: none

      - name: Setup composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-flux${{ matrix.flux }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-flux${{ matrix.flux }}-
            ${{ runner.os }}-composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
            ${{ runner.os }}-composer-php${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: Resolve matrix dependencies
        run: |
          echo "Installing Laravel: ${{ matrix.laravel }}"
          composer require "laravel/framework:^${{ matrix.laravel }}" --no-update --no-interaction
          echo "Installing livewire/flux variant: ${{ matrix.flux }}"
          composer require "livewire/flux:^${{ matrix.flux }}" --no-update --no-interaction || true

          if [ "${{ matrix.flux }}" = "1" ]; then
            echo "Removing livewire/blaze for livewire/flux v1 compatibility"
            composer remove --dev livewire/blaze --no-update --no-interaction
          fi

          composer update --with-all-dependencies --no-interaction --prefer-dist

      - name: Run Pint (style check)
        run: ./vendor/bin/pint --test
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse src -c phpstan.neon --no-progress

      - name: Run tests (Pest)
        run: ./vendor/bin/pest --colors=always -v
